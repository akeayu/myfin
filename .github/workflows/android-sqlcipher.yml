name: MYFIN Android SQLite verification
on:
  push:
    branches:
      - feat/a3-financial-calendar-offline-iroka-foundation
      - fix/a3-keystore-fail-closed-sidecar
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: myfin-android-sqlcipher-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-sqlcipher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run type and unit tests
        run: npm run check
      - name: Build Android smoke application
        run: npm run build:android-smoke
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Disable automatic Android app-data backup
        run: node scripts/patch-android-manifest.mjs
      - name: Sync native Capacitor plugins
        run: npx cap sync android
      - name: Verify and record generated MainActivity compiled by Gradle
        run: |
          ACTIVITY=android/app/src/main/java/com/myfin/app/MainActivity.java
          test -s "$ACTIVITY"
          echo "===== GENERATED MAINACTIVITY.JAVA (APK BUILD INPUT) ====="
          sha256sum "$ACTIVITY"
          cat "$ACTIVITY"
          grep -q 'NATIVE_ACTIVITY_ONCREATE' "$ACTIVITY"
          grep -q 'NATIVE_ACTIVITY_ONRESUME' "$ACTIVITY"
          echo "PASS: native Activity lifecycle markers are present in the Java source passed to Gradle."
      - name: Build minimal WebView-only control APK
        run: |
          mkdir -p android/app/src/main/assets
          cp android-smoke/webview-control.html android/app/src/main/assets/webview-control.html
          mkdir -p android/app/src/main/java/com/myfin/app
          cat > android/app/src/main/java/com/myfin/app/WebViewControlActivity.java <<'JAVA'
          package com.myfin.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class WebViewControlActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.getSettings().setJavaScriptEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/webview-control.html");
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = "    </application>"
          activity = '        <activity android:name=".WebViewControlActivity" android:exported="true" android:label="WebView control" />\n'
          assert marker in s and "WebViewControlActivity" not in s
          p.write_text(s.replace(marker, activity + marker))
          PY
          chmod +x android/gradlew
          ./android/gradlew -p android app:assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/myfin-webview-control.apk
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android app:assembleDebug
      - name: Upload synthetic Android APK for physical-device verification
        uses: actions/upload-artifact@v4
        with:
          name: myfin-android-storage-smoke-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/myfin-webview-control.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run encrypted SQLite tests on Android emulator
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 1800
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify-android-smoke.sh
